name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visionaid
          POSTGRES_PASSWORD: visionaid
          POSTGRES_DB: visionaid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visionaid" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      VISIONAID_TEST_DATABASE_URL: postgresql+psycopg://visionaid:visionaid@localhost:5432/visionaid_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: pytest
      - name: Migrations match models
        env:
          VISIONAID_DATABASE_URL: postgresql+psycopg://visionaid:visionaid@localhost:5432/visionaid_test
          VISIONAID_JWT_SECRET: ci-only-not-a-secret
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  edge-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C edge/esp32/tests/host

  firmware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v7
      - name: Build for esp32s3
        shell: bash
        working-directory: edge/esp32/firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff
      - run: ruff check ai edge/esp32/tools --line-length 100
      - run: python -m pytest ai/tests -q
